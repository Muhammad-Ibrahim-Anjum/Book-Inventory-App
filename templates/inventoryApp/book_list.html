{% extends 'inventoryApp/layout.html' %}

{% block title %}Book List{% endblock %}

{% block content %}
    <div class="container">
        <h2 class="text-center">Book List</h2>
        <table class="table table-bordered table-hover text-center">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Author</th>
                    <th>ISBN</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for book in books %}
                    <tr>
                        <td>{{ book.title }}</td>
                        <td>{{ book.author }}</td>
                        <td>{{ book.isbn }}</td>
                        <td>
                            <a href="{% url 'inventoryApp:book_update' book.book_id %}" class="btn btn-sm btn-primary">Edit</a>
                            <a href="{% url 'inventoryApp:book_delete' book.book_id %}" class="btn btn-sm btn-warning">Delete</a>
                        </td>
                    </tr>
                {% empty %}
                    <tr>
                        <td colspan="4">No books available.</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
{% endblock %}
