{% extends 'inventoryApp/layout.html' %}
{% load static %}
{% block title %}Confirm Logout{% endblock %}

{% block content %}
        <div class="container">
            <h2>Confirm Logout</h2>
            <p>Are you sure you want to logout?</p>
            <form method="POST" action="{% url 'authApp:logout' %}">
                {% csrf_token %}
                <button type="submit">Logout</button>
            </form>
            <a href="{% url 'inventoryApp:home' %}">Cancel</a>
        </div>
{% endblock %}
